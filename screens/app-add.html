<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ソデマネ — 予定を追加</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Kaisei+Decol:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --oshi-pink:#ff5fa2; --oshi-pink-deep:#d61f69; --purple:#8b5cf6;
  --gold:#f59e0b; --mint:#34d399;
  --cream:#fff7fb; --white:#ffffff; --ink:#2b1b26; --ink-muted:#7a6b74; --line:#f3e3ec;
  --pink-soft:#ffe6f1; --grad-primary:linear-gradient(120deg,#ff5fa2 0%,#b06bf0 55%,#8b5cf6 100%);
  --font-body:"Zen Maru Gothic",system-ui,-apple-system,sans-serif;
  --r-md:14px; --r-lg:22px; --r-pill:99px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:8px;background:transparent;
  font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.phone{width:390px;max-width:100%;background:#1f1430;border-radius:46px;padding:11px;
  box-shadow:0 36px 80px rgba(31,20,48,.42);position:relative}
.notch{position:absolute;top:21px;left:50%;transform:translateX(-50%);width:120px;height:30px;
  background:#1f1430;border-radius:99px;z-index:6}
.screen{position:relative;background:#cbb9d8;border-radius:36px;overflow:hidden;height:812px;
  display:flex;flex-direction:column;justify-content:flex-end}
.dim{position:absolute;inset:0;background:rgba(43,27,38,.34)}
.sheet{position:relative;background:var(--white);border-radius:26px 26px 36px 36px;padding:18px 20px 24px;
  box-shadow:0 -14px 40px rgba(31,20,48,.25)}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.h b{font-size:19px;color:var(--ink)}
.h .x{color:var(--ink-muted);font-size:18px}
.field{border:1.6px solid #a87690;border-radius:var(--r-md);padding:12px 14px;display:flex;gap:10px;
  align-items:center;font-weight:700;color:var(--ink);position:relative;margin-bottom:16px}
.field .lbl{position:absolute;top:-9px;left:12px;background:var(--white);padding:0 5px;
  font-size:11px;color:var(--oshi-pink-deep);font-weight:800}
.field .caret{width:2px;height:18px;background:var(--oshi-pink-deep);animation:bl 1.1s step-end infinite}
@keyframes bl{50%{opacity:0}}
.qlbl{font-size:12px;font-weight:800;color:var(--ink-muted);margin:0 0 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.4px solid var(--line);border-radius:var(--r-pill);padding:7px 13px;font-size:13px;
  font-weight:800;color:var(--ink);background:var(--white);display:flex;gap:6px;align-items:center}
.chip.on{background:#efe6ff;border-color:#b8a4e6;box-shadow:0 1px 4px rgba(139,92,246,.18)}
.chip.on::before{content:"✓";font-size:11px;color:#6d28d9}
.chip .dot{width:11px;height:11px;border-radius:50%}
.slots{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 14px;margin:2px 0 14px}
.slots .row{display:flex;gap:10px;margin-bottom:10px}
.slot{flex:1;border:1.4px solid #a87690;border-radius:var(--r-md);padding:9px 11px;position:relative;
  font-weight:800;font-size:13.5px;color:var(--ink);background:var(--white)}
.slot .lbl{position:absolute;top:-8px;left:10px;background:var(--white);padding:0 4px;
  font-size:10px;color:var(--oshi-pink-deep);font-weight:800}
.slots .note{font-size:10.5px;color:var(--ink-muted);line-height:1.55;margin:2px 0 0}
.more{display:flex;justify-content:space-between;align-items:center;color:var(--ink-muted);
  font-size:13px;font-weight:700;padding:4px 2px 14px}
.cta{background:var(--grad-primary);color:#fff;border-radius:var(--r-pill);text-align:center;
  padding:15px;font-size:16px;font-weight:900;box-shadow:0 10px 24px rgba(214,31,105,.28)}
.tapnote{position:absolute;top:120px;left:0;right:0;text-align:center;color:#fff;font-weight:900;
  font-size:15px;text-shadow:0 2px 10px rgba(31,20,48,.5)}
.tapnote span{display:block;font-size:12px;font-weight:700;opacity:.92;margin-top:4px}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="dim"></div>
    <div class="tapnote">予定の追加は、3タップ。<span>名前 → いつ？ → 追加する。あとから全部そだてられます。</span></div>
    <div class="sheet">
      <div class="grab"></div>
      <div class="h"><b>イベントを追加</b><span class="x">✕</span></div>
      <div class="field"><span class="lbl">イベント名</span>✏️ 夏フェス ドーム遠征<span class="caret"></span></div>
      <p class="qlbl">いつ？</p>
      <div class="chips">
        <span class="chip">今日</span><span class="chip">明日</span>
        <span class="chip on">8月9日(土)</span>
        <span class="chip">📅 日付を選ぶ</span><span class="chip">未定</span>
      </div>
      <p class="qlbl">推し（任意）</p>
      <div class="chips">
        <span class="chip on"><span class="dot" style="background:#ff5fa2"></span>あかり</span>
        <span class="chip"><span class="dot" style="background:#2563eb"></span>ネオ☆スターズ</span>
      </div>
      <div class="chips" style="margin-bottom:8px">
        <span class="chip on">🎫 抽選あり（当落待ちにする）</span>
      </div>
      <div class="slots">
        <div class="row">
          <div class="slot"><span class="lbl">応募締切（任意）</span>7月20日(月)</div>
          <div class="slot"><span class="lbl">当落発表（任意）</span>8月5日(水)</div>
        </div>
        <div class="row" style="margin-bottom:4px">
          <div class="slot"><span class="lbl">当選したら払う額</span>¥9,800</div>
          <div class="slot"><span class="lbl">入金締切（任意）</span>8月12日(水)</div>
        </div>
        <p class="note">額を入れると「全部当たったら」と見通しにすぐ反映（落選なら自動で外れます）。<br>申込・支払いはアプリでは行いません（記録と通知のみ）。</p>
      </div>
      <div class="more">詳しく（種別・確度・期間・候補日・パック）<span>⌄</span></div>
      <div class="cta">追加する</div>
    </div>
  </div>
</div>
</body>
</html>
